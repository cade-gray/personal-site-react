server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # create-react-app fingerprints everything under /static/, so it can be
    # cached forever. (Vite projects use /assets/ for the same thing.)
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry point must never be cached, or a deploy never reaches anyone
    # holding an older copy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: /about and /projects are React Router paths with no
    # file behind them, so unmatched requests fall through to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
